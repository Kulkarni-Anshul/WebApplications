<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calendar</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<main>
    <a class="back-link" href="index.html">&larr; Back to home</a>
    <h1>Calendar</h1>
    <p class="subtitle">Pick a date that is today or later, then verify.</p>
    <div class="card">
        <label for="booking-date">Booking date</label>
        <input type="date" id="booking-date">
        <button id="verify-button" type="button">Verify</button>
        <div class="result" id="result" data-status="none">No verification run yet.</div>
    </div>
</main>
<script src="js/verify.js"></script>
<script>
    function todayAsIsoDate() {
        var now = new Date();
        var month = String(now.getMonth() + 1).padStart(2, '0');
        var day = String(now.getDate()).padStart(2, '0');
        return now.getFullYear() + '-' + month + '-' + day;
    }

    document.getElementById('verify-button').addEventListener('click', function () {
        var value = document.getElementById('booking-date').value;
        if (!value) {
            showResult('result', 'Verification failed: no date selected.', false);
        } else if (value < todayAsIsoDate()) {
            showResult('result', 'Verification failed: ' + value + ' is in the past.', false);
        } else {
            showResult('result', 'Verification passed: selected date is ' + value + '.', true);
        }
    });
</script>
</body>
</html>
